<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100d">
<title>주사위</title>
<style>
:root{
  --ink-900:#12100d; --ink-700:#221e1a; --line:#332e28;
  --text:#ece7de; --dim:#8b8275; --faint:#463f37;
  --gold:#e8b339; --red:#e5534b;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",
    "맑은 고딕",system-ui,sans-serif;
  --size:108px; --half:54px; --spin:1400ms;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--ink-900);color:var(--text);font:15px/1.6 var(--font);
  padding:40px 16px 60px;display:flex;flex-direction:column;
  align-items:center;gap:20px}

/* ── 주사위가 노는 공간 ──────────────────────────────────────── */
/* perspective 가 있어야 **진짜 3차원**으로 보인다. 없으면 납작해진다 */
.tray{display:flex;gap:72px;flex-wrap:wrap;justify-content:center;
  perspective:900px;perspective-origin:50% 40%;
  padding:24px 0;min-height:200px;align-items:center}

/* 살짝 비스듬히 세워 둔다. 옆면 둘이 같이 보여야 입체로 읽힌다 */
.tilt{transform:rotateX(-16deg) rotateY(-24deg);transform-style:preserve-3d}

.die{width:var(--size);height:var(--size);position:relative;
  transform-style:preserve-3d;        /* 면들이 3차원에 그대로 선다 */
  transition:transform var(--spin) cubic-bezier(.16,.84,.28,1)}

.face{position:absolute;inset:0;
  background:#f4f1ea;border-radius:10px;border:1px solid #d8d2c4;
  box-shadow:inset 0 0 18px rgba(120,110,90,.16);
  display:grid;grid-template-columns:repeat(3,1fr);
  grid-template-rows:repeat(3,1fr);padding:13px;gap:5px;
  backface-visibility:hidden}
/* 속을 채우는 판 셋. 면을 둥글리면 **여덟 모서리에 구멍**이 나서 뒤의
   검은 배경이 비친다. 정육면체 한가운데를 가로지르는 판 셋을 깔아 두면
   그 구멍으로 이 판들이 보여 틈이 메워진다. 평소엔 면에 가려 안 보인다 */
.core{position:absolute;inset:0;background:#ece6d8;
  backface-visibility:hidden}
.c1{transform:translateZ(0)}
.c2{transform:rotateY(90deg)}
.c3{transform:rotateX(90deg)}

/* 여섯 면을 정육면체 자리로 밀어낸다. 마주 보는 면끼리 합이 7 이다 */
.f1{transform:translateZ(var(--half))}                   /* 앞  */
.f6{transform:rotateY(180deg) translateZ(var(--half))}   /* 뒤  */
.f2{transform:rotateY(90deg)  translateZ(var(--half))}   /* 오른 */
.f5{transform:rotateY(-90deg) translateZ(var(--half))}   /* 왼  */
.f3{transform:rotateX(90deg)  translateZ(var(--half))}   /* 위  */
.f4{transform:rotateX(-90deg) translateZ(var(--half))}   /* 아래 */

.pip{width:100%;height:100%;border-radius:50%;background:#20201d;
  box-shadow:inset 0 -1px 2px rgba(255,255,255,.28)}
/* **1 만 붉은 점** */
.pip.one{background:var(--red);
  box-shadow:inset 0 -1px 2px rgba(255,255,255,.35),
             0 0 9px rgba(229,83,75,.45)}

button{font:inherit;color:var(--gold);background:var(--ink-700);
  border:1px solid var(--gold);border-radius:8px;padding:13px 34px;
  cursor:pointer;font-size:16px;font-weight:600}
button:active{background:var(--line)}
button:disabled{opacity:.35;cursor:default;border-color:var(--line);
  color:var(--dim)}

.read{font:14px/1.8 "Cascadia Mono",Consolas,monospace;color:var(--dim);
  text-align:center;margin:0}
.read b{color:var(--text);font-size:17px}
.note{color:var(--faint);font-size:12px;line-height:1.75;margin:0;
  max-width:30rem;text-align:center}
</style>
</head>
<body>

<div class="tray" id="tray"></div>
<button id="roll">굴리기</button>
<p class="read" id="read">&mdash;</p>
<p class="note">눈을 <b>먼저 뽑고</b> 그 면이 앞으로 오는 회전을 계산해
  보낸다. 착지 자세가 계산된 값이라 비스듬히 걸치거나 올라탈 방법이 없다.</p>

<script>
/* ─────────────────────────────────────────────────────────────────
   주사위 — 답을 **먼저 정하고** 그 눈으로 내려앉힌다.

   물리로 굴리면 어디서 멈출지 모른다. 비스듬히 걸치거나 남의 위에
   올라타면 판정이 흐려진다. 무엇보다 **화면마다 결과가 달라진다** —
   부동소수점과 프레임이 기기마다 다르기 때문이다. 넷이 각자 화면을 보는
   게임에서는 그것만으로 못 쓴다.

       1. 눈을 먼저 뽑는다          (게임에서는 서버가 뽑는다)
       2. 그 면이 앞으로 오는 회전을 꺼낸다
       3. 거기에 몇 바퀴를 얹어 굴린다   ← 바퀴는 360 의 배수라 착지엔 영향이 없다
   ───────────────────────────────────────────────────────────── */
"use strict";

/* 3×3 자리에 점을 어디에 찍나 (왼위부터 1..9) */
var PIPS = {
  1: [5], 2: [1, 9], 3: [1, 5, 9],
  4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9]
};

/* 그 눈이 **앞으로** 오게 하는 회전. 면을 놓을 때 쓴 변환의 정확한 반대다 */
var FACE = {
  1: {x: 0, y: 0},     6: {x: 0, y: 180},
  2: {x: 0, y: -90},   5: {x: 0, y: 90},
  3: {x: -90, y: 0},   4: {x: 90, y: 0}
};

function faceHTML(n) {
  var on = PIPS[n], html = "";
  for (var i = 1; i <= 9; i++) {
    html += on.indexOf(i) >= 0
      ? '<div class="pip' + (n === 1 ? " one" : "") + '"></div>'
      : "<div></div>";
  }
  return '<div class="face f' + n + '">' + html + "</div>";
}

function makeDie() {
  var tilt = document.createElement("div");
  tilt.className = "tilt";
  var die = document.createElement("div");
  die.className = "die";
  var html = '<div class="core c1"></div><div class="core c2"></div>' +
             '<div class="core c3"></div>';
  for (var n = 1; n <= 6; n++) html += faceHTML(n);
  die.innerHTML = html;
  tilt.appendChild(die);
  die.turns = 0;                    /* 여태 돈 바퀴 — 늘 앞으로만 돈다 */
  var f = FACE[1];
  die.style.transition = "none";
  die.style.transform = "rotateX(" + f.x + "deg) rotateY(" + f.y + "deg)";
  void die.offsetWidth;
  die.style.transition = "";
  return {tilt: tilt, die: die};
}

function place(die, n) {
  var f = FACE[n];
  die.turns += 2 + ((Math.random() * 2) | 0);
  var spin = die.turns * 360;
  die.style.transform =
    "rotateX(" + (spin + f.x) + "deg) rotateY(" + (spin + f.y) + "deg)";
}

var tray = document.getElementById("tray");
var dice = [];
[0, 1].forEach(function () {                /* 두 알 */
  var d = makeDie();
  tray.appendChild(d.tilt);
  dice.push(d.die);
});

var btn = document.getElementById("roll");
btn.onclick = function () {
  var got = [];
  dice.forEach(function (die, i) {
    var n = 1 + ((Math.random() * 6) | 0);
    got.push(n);
    setTimeout(function () { place(die, n); }, i * 110);
  });
  document.getElementById("read").innerHTML =
    "<b>" + got.join(" · ") + "</b>   합 " + (got[0] + got[1]);
  /* 구르는 동안은 못 누른다 — 도중에 바꾸면 자세가 꼬인다 */
  btn.disabled = true;
  setTimeout(function () { btn.disabled = false; }, 1400 + 110 * dice.length + 300);
};
</script>
</body>
</html>
